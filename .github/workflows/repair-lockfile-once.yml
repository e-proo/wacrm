name: Repair Lockfile Once

on:
  push:
    branches: [test/ai-runtime-kb-tools-v2]
    paths:
      - .github/workflows/repair-lockfile-once.yml
      - package.json
      - package-lock.json

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test/ai-runtime-kb-tools-v2
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Regenerate npm lockfile metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json is already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Sync npm lockfile metadata'
          git push origin HEAD:test/ai-runtime-kb-tools-v2
