name: Service Platform Phase 6 FX Transport Once

on:
  push:
    branches: [refactor/service-platform-v2]
    paths:
      - '.github/workflows/service-platform-phase6-fx-transport-once.yml'

concurrency:
  group: service-platform-phase6-fx-transport-once
  cancel-in-progress: false

jobs:
  fx-transport:
    name: FX Phase 6 final TEST transport
    runs-on: ubuntu-latest
    environment: wacrm-test
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.WACRM_TEST_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.WACRM_TEST_SUPABASE_SERVICE_ROLE_KEY }}
      ENCRYPTION_KEY: ${{ secrets.WACRM_TEST_ENCRYPTION_KEY }}
      WACRM_FX_CUTOVER_LIVE_ACCOUNT_ID: ${{ vars.WACRM_TEST_ACCOUNT_ID }}
      WACRM_FX_CUTOVER_TEST_CONTACT_ID: ${{ vars.WACRM_INTENTS_CUTOVER_TEST_CONTACT_ID }}
      WACRM_FX_CUTOVER_TEST_CONVERSATION_ID: ${{ vars.WACRM_INTENTS_CUTOVER_TEST_CONVERSATION_ID }}
      WACRM_FX_CUTOVER_TRANSPORT_E2E_LIVE: '1'
      WACRM_FX_CUTOVER_TRANSPORT_E2E_CONFIRM: SEND_TEST_WHATSAPP

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate dedicated TEST transport configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            NEXT_PUBLIC_SUPABASE_URL
            SUPABASE_SERVICE_ROLE_KEY
            ENCRYPTION_KEY
            WACRM_FX_CUTOVER_TEST_CONTACT_ID
            WACRM_FX_CUTOVER_TEST_CONVERSATION_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required TEST configuration is missing: $name"
              exit 1
            fi
          done

      - name: Resolve TEST account
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WACRM_FX_CUTOVER_LIVE_ACCOUNT_ID:-}" ]]; then
            exit 0
          fi

          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { createClient } from '@supabase/supabase-js'

          const url = process.env.NEXT_PUBLIC_SUPABASE_URL
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY
          if (!url || !key) throw new Error('SUPABASE_TEST_ENV_REQUIRED')

          const db = createClient(url, key)
          const { data, error } = await db
            .from('accounts')
            .select('id')
            .order('created_at', { ascending: true })
            .limit(2)

          if (error) throw error
          if (!data || data.length !== 1) {
            throw new Error(
              'WACRM_TEST_ACCOUNT_ID_REQUIRED_WHEN_TEST_HAS_MULTIPLE_ACCOUNTS',
            )
          }

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `WACRM_FX_CUTOVER_LIVE_ACCOUNT_ID=${data[0].id}\n`,
          )
          NODE

      - name: Send one post-retirement FX WhatsApp E2E fixture
        run: npm run test:fx-cutover-transport-live
