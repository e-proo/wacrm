name: Repair Agent Admin Workflow Once

on:
  push:
    branches: [test/ai-runtime-kb-tools-v2]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fix phone input reset strategy in generator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/fix-agent-admin-ux-once.yml')
          text = path.read_text()

          replacements = [
              ("            resetKey?: number\n", ""),
              ("            resetKey = 0,\n", ""),
              ("""            useEffect(() => {\n              setNationalNumber('')\n              setValid(false)\n              onChange('')\n            }, [resetKey]) // eslint-disable-line react-hooks/exhaustive-deps\n\n""", ""),
              ("                          resetKey={phoneResetKey}\n", "                          key={phoneResetKey}\n"),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing workflow anchor: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit workflow correction
        shell: bash
        run: |
          rm -f .github/workflows/repair-agent-admin-workflow-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/fix-agent-admin-ux-once.yml .github/workflows/repair-agent-admin-workflow-once.yml
          git commit -m "Fix international phone input reset lint"
          git push origin HEAD:test/ai-runtime-kb-tools-v2
