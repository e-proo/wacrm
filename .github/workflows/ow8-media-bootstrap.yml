name: OW8 media bootstrap
on:
  push:
    branches: [refactor/service-platform-v2]
    paths: ['.github/workflows/ow8-media-bootstrap.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/service-platform-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/ow8-media-bootstrap.mjs
      - name: Commit patch and cleanup bootstrap
        run: |
          rm .github/workflows/ow8-media-bootstrap.yml scripts/ow8-media-bootstrap.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/whatsapp/inbound-processor.ts src/app/api/whatsapp/openwa/webhook/route.ts .github/workflows/ow8-media-bootstrap.yml scripts/ow8-media-bootstrap.mjs
          git commit -m "feat(openwa): mirror inbound media through WACRM storage"
          git push origin HEAD:refactor/service-platform-v2
