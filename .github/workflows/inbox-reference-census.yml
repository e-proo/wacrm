name: INBOX reference census
on:
  push:
    branches: [refactor/service-platform-v2]
    paths:
      - 'scripts/inbox-reference-census.mjs'
      - '.github/workflows/inbox-reference-census.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Inventory exact checkout (read only)
        run: node scripts/inbox-reference-census.mjs
