name: Materialize Repair Once

on:
  push:
    branches: [test/ai-runtime-kb-tools-v2]
    paths:
      - .github/workflows/materialize-repair-once.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply verified repair bundle
        run: bash repair/apply-repair-bundle.sh

      - name: Remove transport-only repair files
        run: |
          rm -rf repair
          rm -f .github/workflows/repair-bundle-ci.yml
          rm -f .github/workflows/materialize-repair-once.yml

      - name: Commit materialized source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize AI runtime, knowledge, and tool platform repairs"
          git push origin HEAD:test/ai-runtime-kb-tools-v2
