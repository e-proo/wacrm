name: WhatsApp TEST Registration Diagnostic

on:
  push:
    branches: [refactor/service-platform-v2]
    paths:
      - '.github/diagnostics/whatsapp-test-registration.trigger'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: wacrm-test
    env:
      ENCRYPTION_KEY: ${{ secrets.WACRM_TEST_ENCRYPTION_KEY }}

    steps:
      - name: Validate encryption key
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${ENCRYPTION_KEY:-}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "WACRM_TEST_ENCRYPTION_KEY is missing or invalid."
            exit 1
          fi

      - name: Call TEST Meta registration diagnostic
        shell: bash
        run: |
          set -euo pipefail
          response="$(
            curl --fail --silent --show-error               -H "x-wacrm-encryption-key: $ENCRYPTION_KEY"               https://pqirsnfupofhulmewakq.supabase.co/functions/v1/wacrm-whatsapp-registration-diag-temp
          )"
          echo "$response"
          ok="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.ok===true?"yes":"no")' "$response")"
          if [[ "$ok" != "yes" ]]; then
            exit 1
          fi
