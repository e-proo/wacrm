name: Service Platform Intents Cutover TEST

on:
  push:
    branches: [refactor/service-platform-v2]
    paths:
      - '.github/cutover/intents-evidence-activation.trigger'
  workflow_dispatch:
    inputs:
      gate:
        description: Controlled TEST gate to run
        required: true
        type: choice
        options:
          - evidence
          - activate
          - transport
          - rollback
      confirmation:
        description: Exact confirmation phrase required by the selected gate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: service-platform-intents-cutover-test
  cancel-in-progress: false

jobs:
  intents-cutover:
    name: Intents cutover — ${{ github.event_name == 'push' && 'auto-evidence-activate' || inputs.gate }}
    runs-on: ubuntu-latest
    environment: wacrm-test
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.WACRM_TEST_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.WACRM_TEST_SUPABASE_SERVICE_ROLE_KEY }}
      ENCRYPTION_KEY: ${{ secrets.WACRM_TEST_ENCRYPTION_KEY }}
      WACRM_INTENTS_CUTOVER_LIVE_ACCOUNT_ID: ${{ vars.WACRM_TEST_ACCOUNT_ID }}
      WACRM_INTENTS_CUTOVER_TEST_CONTACT_ID: ${{ vars.WACRM_INTENTS_CUTOVER_TEST_CONTACT_ID }}
      WACRM_INTENTS_CUTOVER_TEST_CONVERSATION_ID: ${{ vars.WACRM_INTENTS_CUTOVER_TEST_CONVERSATION_ID }}
      SUPABASE_TEST_ACCESS_TOKEN: ${{ secrets.SUPABASE_TEST_ACCESS_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_TEST_PROJECT_REF: pqirsnfupofhulmewakq

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve TEST Supabase backend credentials
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ]]; then
            echo "NEXT_PUBLIC_SUPABASE_URL=https://${SUPABASE_TEST_PROJECT_REF}.supabase.co" >> "$GITHUB_ENV"
          fi

          if [[ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            echo "::add-mask::$SUPABASE_SERVICE_ROLE_KEY"
            exit 0
          fi

          token="${SUPABASE_TEST_ACCESS_TOKEN:-${SUPABASE_ACCESS_TOKEN:-}}"
          if [[ -z "$token" ]]; then
            echo "No TEST service key or Supabase management access token is configured."
            exit 1
          fi

          response="$(
            curl --fail --silent --show-error               "https://api.supabase.com/v1/projects/${SUPABASE_TEST_PROJECT_REF}/api-keys?reveal=true"               --header "Authorization: Bearer $token"
          )"

          key="$(
            API_KEYS_JSON="$response" node --input-type=module <<'NODE'
          const rows = JSON.parse(process.env.API_KEYS_JSON ?? '[]')
          if (!Array.isArray(rows)) throw new Error('SUPABASE_API_KEYS_RESPONSE_INVALID')
          const selected =
            rows.find((row) => row?.name === 'service_role') ??
            rows.find((row) => row?.name === 'secret') ??
            rows.find((row) => row?.type === 'secret')
          const value = selected?.api_key
          if (typeof value !== 'string' || !value.trim()) {
            throw new Error('SUPABASE_TEST_BACKEND_KEY_NOT_FOUND')
          }
          process.stdout.write(value.trim())
          NODE
          )"

          echo "::add-mask::$key"
          echo "SUPABASE_SERVICE_ROLE_KEY=$key" >> "$GITHUB_ENV"

      - name: Validate TEST configuration and explicit confirmation
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          required=(
            NEXT_PUBLIC_SUPABASE_URL
            SUPABASE_SERVICE_ROLE_KEY
          )

          expected=''
          case "${{ inputs.gate }}" in
            evidence)
              expected='GENERATE_TEST_EVIDENCE'
              ;;
            activate)
              expected='ACTIVATE_TEST'
              ;;
            transport)
              expected='SEND_TEST_WHATSAPP'
              required+=(
                ENCRYPTION_KEY
                WACRM_INTENTS_CUTOVER_TEST_CONTACT_ID
                WACRM_INTENTS_CUTOVER_TEST_CONVERSATION_ID
              )
              ;;
            rollback)
              expected='ROLLBACK_TEST'
              ;;
            *)
              echo 'Unsupported cutover gate.'
              exit 1
              ;;
          esac

          if [[ "${{ inputs.confirmation }}" != "$expected" ]]; then
            echo "Confirmation does not match the selected gate."
            exit 1
          fi

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required TEST configuration is missing: $name"
              exit 1
            fi
          done

      - name: Resolve TEST account
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WACRM_INTENTS_CUTOVER_LIVE_ACCOUNT_ID:-}" ]]; then
            exit 0
          fi

          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { createClient } from '@supabase/supabase-js'

          const url = process.env.NEXT_PUBLIC_SUPABASE_URL
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY
          if (!url || !key) throw new Error('SUPABASE_TEST_ENV_REQUIRED')

          const db = createClient(url, key)
          const { data, error } = await db
            .from('accounts')
            .select('id')
            .order('created_at', { ascending: true })
            .limit(2)

          if (error) throw error
          if (!data || data.length !== 1) {
            throw new Error(
              'WACRM_TEST_ACCOUNT_ID_REQUIRED_WHEN_TEST_HAS_MULTIPLE_ACCOUNTS',
            )
          }

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `WACRM_INTENTS_CUTOVER_LIVE_ACCOUNT_ID=${data[0].id}\n`,
          )
          NODE

      - name: AUTO — Generate 4/4 shadow parity evidence
        if: github.event_name == 'push'
        env:
          WACRM_INTENTS_CUTOVER_EVIDENCE_LIVE: '1'
          WACRM_INTENTS_CUTOVER_EVIDENCE_CONFIRM: GENERATE_TEST_EVIDENCE
        run: npm run test:intents-cutover-evidence-live

      - name: AUTO — Activate controlled Intents route
        if: github.event_name == 'push'
        env:
          WACRM_INTENTS_CUTOVER_ACTIVATE_LIVE: '1'
          WACRM_INTENTS_CUTOVER_CONFIRM: ACTIVATE_TEST
        run: npm run test:intents-cutover-control-live

      - name: Generate 4/4 shadow parity evidence
        if: inputs.gate == 'evidence'
        env:
          WACRM_INTENTS_CUTOVER_EVIDENCE_LIVE: '1'
          WACRM_INTENTS_CUTOVER_EVIDENCE_CONFIRM: GENERATE_TEST_EVIDENCE
        run: npm run test:intents-cutover-evidence-live

      - name: Activate controlled Intents route
        if: inputs.gate == 'activate'
        env:
          WACRM_INTENTS_CUTOVER_ACTIVATE_LIVE: '1'
          WACRM_INTENTS_CUTOVER_CONFIRM: ACTIVATE_TEST
        run: npm run test:intents-cutover-control-live

      - name: Send one active WhatsApp E2E fixture
        if: inputs.gate == 'transport'
        env:
          WACRM_INTENTS_CUTOVER_TRANSPORT_E2E_LIVE: '1'
          WACRM_INTENTS_CUTOVER_TRANSPORT_E2E_CONFIRM: SEND_TEST_WHATSAPP
        run: npm run test:intents-cutover-transport-live

      - name: Roll back controlled Intents route
        if: inputs.gate == 'rollback'
        env:
          WACRM_INTENTS_CUTOVER_ROLLBACK_LIVE: '1'
          WACRM_INTENTS_CUTOVER_CONFIRM: ROLLBACK_TEST
        run: npm run test:intents-cutover-control-live
