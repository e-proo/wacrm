name: OW6 Refactor Bootstrap

on:
  push:
    branches: [refactor/service-platform-v2]
    paths:
      - '.github/workflows/ow6-refactor-bootstrap.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/service-platform-v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Finalize OW-6 shared processor types
        run: python scripts/ow6-fix-processor.py
      - name: Commit type cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/whatsapp/inbound-processor.ts
          git diff --cached --check
          git commit -m "fix(openwa): finalize unified inbound processor types"
          git push origin HEAD:refactor/service-platform-v2
