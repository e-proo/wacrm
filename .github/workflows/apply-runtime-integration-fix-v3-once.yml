name: Apply runtime integration repair v3 once

on:
  push:
    branches:
      - test/ai-runtime-kb-tools-v2
    paths:
      - repair/apply_runtime_integration_fix_v3.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/ai-runtime-kb-tools-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply runtime integration repair v3
        run: python3 repair/apply_runtime_integration_fix_v3.py
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit repaired runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ai/defaults.ts src/lib/ai/runtime/agent-loop.ts src/lib/ai/runtime/dispatch.ts src/lib/ai/runtime/handoff-service.ts src/lib/ai/runtime/builder-service.ts src/lib/ai/runtime/runtime-integration-invariants.test.ts
          if git diff --cached --quiet; then
            echo "No runtime changes to commit"
          else
            git commit -m "Fix admin replies, grounded reads, and human handoff"
            git push origin HEAD:test/ai-runtime-kb-tools-v2
          fi
